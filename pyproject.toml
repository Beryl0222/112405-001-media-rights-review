[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "case-workbench"
version = "0.2.0"
description = "合成文本资料的人物、授权范围与发布复核工作台"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
review-desk = "reviewdesk.cli:main"
case-workbench = "reviewdesk.cli:main"

[tool.setuptools]
py-modules = ["review_desk", "release_desk", "rights_review", "review_system"]

[tool.setuptools.packages.find]
include = ["reviewdesk*", "case_workbench*"]

[tool.unittest]
# Discover with: python3 -m unittest discover -s tests -v
